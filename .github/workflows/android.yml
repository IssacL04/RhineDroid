name: RhineDroid checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37 build-tools;36.0.0'
      - name: Check and build APK
        run: bash scripts/build-apk.sh
      - name: Check WebView composition
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/rhine-playwright/node_modules/playwright/index.mjs
        run: |
          npm install --prefix "$RUNNER_TEMP/rhine-playwright" --no-audit --no-fund playwright@1.64.1
          node "$RUNNER_TEMP/rhine-playwright/node_modules/playwright/cli.js" install --with-deps chromium
          npm run check:composition --prefix web
      - uses: actions/upload-artifact@v7
        with:
          name: RhineDroid-debug
          path: deliverables/*-debug.apk
          if-no-files-found: error
